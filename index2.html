<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://use.typekit.net/cql3gih.css">

    <title>Efeito de Texto</title>

    <!-- Aqui é o CSS dentro do HEAD do HTML. -->
    <style>
        body {
            background-color: blueviolet;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 80pt;

            font-family: "marshmallow-script", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        /* EFEITO COM GIF NO TEXTO */
        .fundo-texto {
            font-size: 15rem;
            font-weight: 1;
            background-image: url("https://i.pinimg.com/originals/f6/4e/67/f64e67b45e52ea1153dbdca4e389af29.gif");
            background-size: cover;
            background-position: center;
            color: transparent;

            background-clip: text;

        }
    </style>


</head>

<body>
    <h1 class="fundo-texto">Felippe✮</h1>



</body>

</html>
